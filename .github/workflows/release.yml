name: Release

# Trigger on version tags created by Gitflow release/hotfix finish operations
# These tags are only created on main branch after successful releases
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Get version from tag
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "Building StorySellerSaver v$VERSION"

        # Check if this is a pre-release (contains -beta or -rc)
        if [[ "$VERSION" == *"-beta"* ]] || [[ "$VERSION" == *"-rc"* ]]; then
          echo "IS_PRERELEASE=true" >> $GITHUB_ENV
          echo "This is a pre-release version"
        else
          echo "IS_PRERELEASE=false" >> $GITHUB_ENV
          echo "This is a stable release version"
        fi

    - name: Build screensaver
      run: |
        xcodebuild -project StorysellerScreensaver.xcodeproj -scheme StorySellerSaver -configuration Release build

    - name: Find built screensaver
      run: |
        SAVER_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "StorySellerSaver.saver" -type d | head -1)
        if [ -z "$SAVER_PATH" ]; then
          echo "Error: Could not find built screensaver"
          exit 1
        fi
        echo "SAVER_PATH=$SAVER_PATH" >> $GITHUB_ENV
        echo "Found screensaver at: $SAVER_PATH"

    - name: Package screensaver
      run: |
        cd "$(dirname "$SAVER_PATH")"
        ditto -c -k --sequesterRsrc --keepParent "StorySellerSaver.saver" "StorySellerSaver-v${VERSION}.zip"
        PACKAGE_PATH="$(dirname "$SAVER_PATH")/StorySellerSaver-v${VERSION}.zip"
        echo "PACKAGE_PATH=$PACKAGE_PATH" >> $GITHUB_ENV
        echo "Package created at: $PACKAGE_PATH"

    - name: Generate release notes
      run: |
        if [[ "${IS_PRERELEASE}" == "true" ]]; then
          PRERELEASE_WARNING="⚠️  **This is a pre-release version for testing purposes only.**"
          STABILITY_NOTE="This version may contain bugs or incomplete features. Use at your own risk."
        else
          PRERELEASE_WARNING=""
          STABILITY_NOTE=""
        fi

        cat > release_notes.md << EOF
        ## StorySellerSaver v${VERSION}

        ${PRERELEASE_WARNING}

        ### ✨ What's New
        - Enhanced floating logo animation
        - Improved timing and visual effects
        - Optimized performance for all screen sizes
        - Professional build and packaging

        ### 📦 Installation
        1. Download \`StorySellerSaver-v${VERSION}.zip\` below
        2. Unzip the file
        3. Double-click \`StorySellerSaver.saver\` to install
        4. Configure in System Settings → Screen Saver

        ### 🖥️ System Requirements
        - macOS 10.15 or later
        - Intel or Apple Silicon Macs

        ### 🔧 Features
        - Elegant word carousel with meaningful phrases
        - Floating "CREATIVE BUSINESS" logo
        - Smooth 60fps animations
        - Accessibility support
        - Responsive typography

        ${STABILITY_NOTE}

        ---
        Built with ❤️ for creative professionals
        EOF

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ env.VERSION }}
        name: StorySellerSaver v${{ env.VERSION }}
        body_path: release_notes.md
        draft: false
        prerelease: ${{ env.IS_PRERELEASE }}
        files: ${{ env.PACKAGE_PATH }}
        token: ${{ secrets.GITHUB_TOKEN }}